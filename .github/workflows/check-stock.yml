name: Steam Frame Australia stock tracker

on:
  push:
    paths:
      - '.github/workflows/check-stock.yml'
      - 'steam_frame_tracker.py'
      - 'api/au-inventory.mjs'
  schedule:
    # Hourly at minute 31 UTC; modifying the cron re-registers the GitHub scheduler.
    - cron: '31 * * * *'
  workflow_dispatch:
    inputs:
      send_test:
        description: 'Send a test message to Discord'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: steam-frame-au-check
  cancel-in-progress: false

jobs:
  stock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Australian inventory and send Discord alerts
        env:
          AU_ENDPOINT_URL: https://steam-frame-au-watch.vercel.app/api/au-inventory
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          SEND_TEST: ${{ inputs.send_test || 'false' }}
        run: python3 steam_frame_tracker.py

      - name: Save last-known inventory (only when changed)
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- stock-status.json)" ]] || [[ -f stock-status.json && -z "$(git ls-files -- stock-status.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stock-status.json
            git commit -m "Update Steam Frame AU inventory state [skip ci]"
            git push
          else
            echo "Stock state unchanged; nothing to commit"
          fi
